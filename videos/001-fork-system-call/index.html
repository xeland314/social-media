<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }

      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #title .alt { color: var(--sem-alt); }

      #codePanel { left: 72px; top: 330px; width: 936px; }
      #diagram { left: 72px; top: 1010px; width: 936px; }
      #diagram svg { width: 936px; height: auto; overflow: visible; font-family: var(--font-code); }
      #term { left: 72px; top: 1560px; width: 936px; }

      /* SVG */
      .box { fill: rgba(249, 230, 198, 0.05); stroke: var(--line); stroke-width: 1.5; }
      .lbl { font-size: 10.8px; font-weight: 800; fill: var(--ink); }
      .proc { fill: rgba(249, 230, 198, 0.05); stroke: var(--line); stroke-width: 1.5; }
      .proc.padre { fill: rgba(124, 251, 76, 0.1); stroke: rgba(124, 251, 76, 0.6); }
      .proc.hijo { fill: rgba(63, 208, 224, 0.1); stroke: rgba(63, 208, 224, 0.6); }
      .edge { fill: none; stroke-width: 2.4; }
      .edge.trunk { stroke: var(--line); }
      .edge.a-padre { stroke: rgba(124, 251, 76, 0.8); }
      .edge.a-hijo { stroke: rgba(63, 208, 224, 0.8); }
      .dup { fill: none; stroke: var(--sem-magic); stroke-width: 2.8; stroke-dasharray: 7 5; }
      .dup-head { fill: var(--sem-magic); }
      .chip-box.true { fill: rgba(124, 251, 76, 0.14); stroke: rgba(124, 251, 76, 0.7); stroke-width: 1.2; }
      .chip-box.false { fill: rgba(255, 95, 87, 0.12); stroke: rgba(255, 95, 87, 0.7); stroke-width: 1.2; }
      .chip-t { font-size: 10.8px; font-weight: 800; }
      .chip-t.t { fill: #baffa1; }
      .chip-t.f { fill: #fecaca; }
      .ret { font-size: 10.8px; font-weight: 800; fill: var(--muted); }
      .state { font-size: 10.8px; font-weight: 800; fill: var(--ink); opacity: 0; }

      #mascot, #mascotChild { bottom: 14px; width: 96px; height: 96px; }
      #mascot { left: 72px; }
      #mascotChild { left: 184px; opacity: 0; filter: hue-rotate(165deg); }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="21" data-track-index="0">LINUX · PROCESOS</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="21" data-track-index="1">fork(): una llamada,<br /><span class="alt">dos</span> procesos</h1>

      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="21" data-track-index="2">
        <div class="code-top">
          <span class="code-dot" style="color:#ff5f57"></span>
          <span class="code-dot" style="color:#febc2e"></span>
          <span class="code-dot" style="color:#28c840"></span>
          <span class="code-file">fork_demo.c</span>
          <span class="code-badge-slot">
            <span class="px-chip" id="b-compile" style="color:var(--cat-sage)">COMPILANDO</span>
            <span class="px-chip" id="b-fork" style="color:var(--sem-magic)">LLAMANDO A FORK()</span>
            <span class="px-chip" id="b-dup" style="color:var(--sem-magic)">DUPLICANDO</span>
            <span class="px-chip" id="b-exit" style="color:var(--sem-ok)">EXIT 0 EN AMBOS</span>
            <span class="px-chip" id="b-done" style="color:var(--sem-ok)">DEMO COMPLETA</span>
          </span>
        </div>
        <div class="code-body" id="codeBody"></div>
      </div>

      <div id="diagram" class="abs clip" data-start="0" data-duration="21" data-track-index="3">
        <svg viewBox="0 18 360 205" fill="none">
          <defs>
            <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" class="dup-head"></path>
            </marker>
          </defs>
          <rect x="126" y="24" width="108" height="22" class="box"></rect>
          <text x="180" y="39" text-anchor="middle" class="lbl">bash · pid=1000</text>
          <path d="M 180 46 L 180 62" class="edge trunk"></path>

          <g id="gSingle">
            <rect x="104" y="62" width="152" height="26" class="proc"></rect>
            <text x="180" y="79" text-anchor="middle" class="lbl">fork_demo · pid=1000</text>
          </g>

          <path id="dup" d="M 256 88 C 306 98, 306 116, 268 128" class="dup" marker-end="url(#arrowHead)" opacity="0"></path>
          <path id="edgeP" d="M 180 88 C 180 106, 98 106, 98 122" class="edge a-padre" opacity="0"></path>
          <path id="edgeC" d="M 180 88 C 180 106, 262 106, 262 122" class="edge a-hijo" opacity="0"></path>

          <g id="gParent" opacity="0">
            <rect id="nodeP" x="26" y="122" width="144" height="26" class="proc padre"></rect>
            <text x="98" y="139" text-anchor="middle" class="lbl">padre · pid=1000</text>
          </g>
          <g id="gChild" opacity="0">
            <rect id="nodeC" x="190" y="122" width="144" height="26" class="proc hijo"></rect>
            <text x="262" y="139" text-anchor="middle" class="lbl">hijo · pid=4321</text>
          </g>

          <g id="chipP" opacity="0">
            <rect x="26" y="155" width="144" height="20" class="chip-box false"></rect>
            <text x="98" y="169" text-anchor="middle" class="chip-t f">pid == 0 → falso</text>
          </g>
          <g id="chipC" opacity="0">
            <rect x="190" y="155" width="144" height="20" class="chip-box true"></rect>
            <text x="262" y="169" text-anchor="middle" class="chip-t t">pid == 0 → verdadero</text>
          </g>

          <text id="retP" x="98" y="188" text-anchor="middle" class="ret">return 0</text>
          <text id="retC" x="262" y="188" text-anchor="middle" class="ret">return 0</text>

          <text id="s0" x="8" y="214" class="state" style="opacity:1">bash ejecuta ./fork_demo</text>
          <text id="s1" x="8" y="214" class="state">fork() duplica al proceso llamador</text>
          <text id="s2" x="8" y="214" class="state">dos procesos idénticos reanudan en la misma línea</text>
          <text id="s3" x="8" y="214" class="state">ambos evalúan el valor de retorno de fork()</text>
          <text id="s4" x="8" y="214" class="state">en el hijo pid==0 · en el padre pid==hijo</text>
          <text id="s5" x="8" y="214" class="state">return 0 en padre e hijo</text>
        </svg>
      </div>

      <div id="term" class="abs px-box term clip" data-start="0" data-duration="21" data-track-index="4">
        <div class="term-label">CONSOLA</div>
        <div class="term-row type" id="r1" style="display:none;color:#d1d5db">$ gcc fork_demo.c -o fork_demo &amp;&amp; ./fork_demo</div>
        <div class="term-row type" id="r2" style="display:none">antes: un solo proceso</div>
        <div class="term-row type" id="r3" style="display:none;color:var(--sem-alt)">hijo: pid=4321</div>
        <div class="term-row type" id="r4" style="display:none;color:var(--sem-ok)">padre: hijo=4321</div>
        <div class="term-row type" id="r5" style="display:none;color:var(--cat-sage)">(el orden puede intercalarse)</div>
        <div class="term-row type" id="r6" style="display:none;color:#d1d5db">$ echo $?</div>
        <div class="term-row type" id="r7" style="display:none;color:#d1d5db">0</div>
      </div>

      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="21" data-track-index="5" />
      <img id="mascotChild" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="21" data-track-index="6" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="21" data-track-index="7">@xeland314</div>
      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud2" src="shared/audio/blip.wav" data-start="2.2" data-duration="0.12" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/fork.wav" data-start="3.8" data-duration="0.55" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/fork.wav" data-start="6.0" data-duration="0.55" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/pop.wav" data-start="7.3" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud6" src="shared/audio/blip.wav" data-start="11.6" data-duration="0.12" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud7" src="shared/audio/blip.wav" data-start="13.1" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud8" src="shared/audio/confirm.wav" data-start="14.6" data-duration="0.4" data-track-index="23" data-volume="0.8"></audio>
      <audio id="aud9" src="shared/audio/confirm.wav" data-start="17.8" data-duration="0.4" data-track-index="24" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // --- Código ---
      const K = (t) => `<span class="tok-kw">${t}</span>`;
      const S = (t) => `<span class="tok-str">${t}</span>`;
      const F = (t) => `<span class="tok-fn">${t}</span>`;
      const N = (t) => `<span class="tok-num">${t}</span>`;
      const sp = (n) => " ".repeat(n);
      const rows = XF.buildCode($("#codeBody"), [
        `${K("#include")} ${S("&lt;unistd.h&gt;")}`,
        `${K("#include")} ${S("&lt;stdio.h&gt;")}`,
        ``,
        `${K("int")} ${F("main")}(${K("void")}) {`,
        `${sp(4)}${F("printf")}(${S('"antes: un solo proceso\\n"')});`,
        `${sp(4)}${K("pid_t")} pid = ${F("fork")}();`,
        ``,
        `${sp(4)}${K("if")} (pid == ${N("0")}) {`,
        `${sp(8)}${F("printf")}(${S('"hijo: pid=%d\\n"')}, ${F("getpid")}());`,
        `${sp(4)}} ${K("else")} {`,
        `${sp(8)}${F("printf")}(${S('"padre: hijo=%d\\n"')}, pid);`,
        `${sp(4)}}`,
        `${sp(4)}${K("return")} ${N("0")};`,
        `}`,
      ]);

      // --- Consola: el contenedor recorta por arriba (alineado abajo) ---
      const show = (id, t, chars, dur) => {
        tl.set(id, { display: "block" }, t);
        XF.typeRow(tl, id, chars, t, dur);
      };

      // --- Insignias de estado ---
      const badges = ["#b-compile", "#b-fork", "#b-dup", "#b-exit", "#b-done"].map($);
      const badge = (el, t) => XF.only(tl, badges, el, t);
      const states = ["#s0", "#s1", "#s2", "#s3", "#s4", "#s5"].map($);
      const state = (i, t) => XF.only(tl, states, states[i], t);

      // 0.0  compilar y ejecutar
      badge(badges[0], 0);
      show("#r1", 0.2, 45, 1.4);
      // 2.2  línea 5
      XF.activeLine(tl, rows, 5, 2.2);
      show("#r2", 2.2, 22, 0.9);
      // 3.8  línea 6 · fork()
      XF.activeLine(tl, rows, 6, 3.8, "var(--sem-magic)", "rgba(192,132,252,0.16)");
      badge(badges[1], 3.8);
      state(1, 3.8);
      // 6.0  duplicando
      badge(badges[2], 6.0);
      tl.set("#dup", { opacity: 1 }, 6.0);
      tl.fromTo("#dup", { strokeDashoffset: 0 }, { strokeDashoffset: -48, duration: 2.6, ease: "steps(13)" }, 6.0);
      // 7.3  dos procesos
      tl.set("#gSingle", { opacity: 0 }, 7.3);
      tl.set(["#edgeP", "#edgeC", "#gParent", "#gChild"], { opacity: 1 }, 7.3);
      tl.set("#mascotChild", { opacity: 1 }, 7.3);
      state(2, 7.3);
      // 8.6  fin de la flecha · línea 8
      tl.set("#dup", { opacity: 0 }, 8.6);
      XF.activeLine(tl, rows, 8, 8.6, "var(--sem-alt)", "rgba(63,208,224,0.14)");
      state(3, 8.6);
      // 10.1 chips
      tl.set(["#chipP", "#chipC"], { opacity: 1 }, 10.1);
      state(4, 10.1);
      // 11.6 hijo imprime (línea 9)
      XF.activeLine(tl, rows, 9, 11.6, "var(--sem-alt)", "rgba(63,208,224,0.14)");
      show("#r3", 11.6, 15, 0.7);
      tl.set("#nodeC", { strokeWidth: 3 }, 11.6);
      // 13.1 padre imprime (línea 11)
      XF.activeLine(tl, rows, 11, 13.1, "var(--sem-ok)", "rgba(124,251,76,0.12)");
      show("#r4", 13.1, 17, 0.7);
      show("#r5", 13.8, 30, 0.7);
      tl.set("#nodeP", { strokeWidth: 3 }, 13.1);
      // 14.6 return 0 (línea 13)
      XF.activeLine(tl, rows, 13, 14.6);
      tl.set(["#retP", "#retC"], { fill: "#7cfb4c" }, 14.6);
      badge(badges[3], 14.6);
      state(5, 14.6);
      // 16.2 echo $?
      show("#r6", 16.2, 9, 0.6);
      show("#r7", 17.0, 1, 0.1);
      // 17.8 listo
      badge(badges[4], 17.8);
      XF.activeLine(tl, rows, 0, 17.8);

      // --- Gato: respira a saltos de 8 px durante todo el video ---
      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 41, yoyo: true }, 0);
      tl.to("#mascotChild", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 26, yoyo: true }, 7.5);

      // Fijar la duración total en 21 s
      tl.set({}, {}, 21);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
