<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #mascot { left: 72px; bottom: 14px; width: 96px; height: 96px; }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
      
      #codePanel { left: 72px; top: 330px; width: 936px; }
      #codePanel .code-line { height: 48px; font-size: 28px; }
      #card { left: 72px; top: 710px; width: 936px; height: 650px; }
      .hd { position: absolute; left: 30px; font-family: var(--font-label); font-weight: 700; font-size: 28px; color: var(--muted); }
      .hr { position: absolute; left: 30px; width: 876px; height: 66px; display: flex; align-items: center; padding: 0 20px; gap: 24px; font-family: var(--font-code); font-weight: 700; font-size: 28px; color: var(--ink); background: var(--panel-2); border: 4px solid var(--line); opacity: 0; }
      .hr b { width: 80px; color: var(--accent); font-weight: 800; }
      .cp { position: absolute; right: 44px; top: 0; opacity: 0; font-size: 26px; padding: 2px 12px; }
      .bar { position: absolute; left: 30px; height: 46px; display: flex; align-items: center; padding: 0 14px; font-family: var(--font-label); font-weight: 700; font-size: 28px; color: #000000; opacity: 0; }
      #sv { position: absolute; right: 30px; top: 520px; width: 330px; height: 80px; }
      #sv .stk { text-align: right; font-family: var(--font-display); font-size: 46px; color: var(--sem-ok); }
      #term { left: 72px; top: 1390px; width: 936px; height: 330px; }

    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="22" data-track-index="0">REDES · HTTP/2</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="22" data-track-index="1">HPACK:<br />comprimir cabeceras</h1>
      
      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="22" data-track-index="2">
        <div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file" style="position:relative;width:360px;height:36px">hpack.txt</span><span class="code-badge-slot" id="badges"></span></div>
        <div class="code-body" id="codeBody"></div>
      </div>
      <div id="card" class="abs px-box clip" data-start="0" data-duration="22" data-track-index="3">
        <div class="hd" style="top:14px">TABLA ESTÁTICA</div>
        <div class="hr" id="hs" style="top:56px"><b>[2]</b>:method: GET<span class="cp px-chip" id="cps" style="color:#3fd0e0;top:6px">[2]</span></div>
        <div class="hd" style="top:140px">TABLA DINÁMICA (compartida)</div>
        <div class="hr" id="h62" style="top:182px"><b>#62</b>:path: /api/users<span class="cp px-chip" id="cp62" style="color:#3fd0e0;top:6px">#62</span></div>
        <div class="hr" id="h63" style="top:256px"><b>#63</b>user-agent: Moz/5.0<span class="cp px-chip" id="cp63" style="color:#3fd0e0;top:6px">#63</span></div>
        <div class="hr" id="h64" style="top:330px"><b>#64</b>accept: application/json<span class="cp px-chip" id="cp64" style="color:#3fd0e0;top:6px">#64</span></div>
        <div class="bar" id="b1" style="top:440px;width:876px;background:#facc15">REQUEST 1 · 128 B</div>
        <div class="bar" id="b2" style="top:500px;width:170px;background:#7cfb4c">24 B</div>
        <div id="sv"></div>
      </div>
      <div id="term" class="abs px-box term clip" data-start="0" data-duration="22" data-track-index="4"><div class="term-label">CONSOLA</div></div>
      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="22" data-track-index="5" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="22" data-track-index="7">@xeland314</div>

      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud1" src="shared/audio/blip.wav" data-start="0.4" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud2" src="shared/audio/pop.wav" data-start="2.0" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/pop.wav" data-start="3.6" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/pop.wav" data-start="5.2" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/pop.wav" data-start="6.8" data-duration="0.18" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud6" src="shared/audio/confirm.wav" data-start="8.4" data-duration="0.4" data-track-index="23" data-volume="0.8"></audio>
      <audio id="aud7" src="shared/audio/whoosh.wav" data-start="10.6" data-duration="0.6" data-track-index="24" data-volume="0.5"></audio>
      <audio id="aud8" src="shared/audio/pop.wav" data-start="11.0" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud9" src="shared/audio/pop.wav" data-start="12.1" data-duration="0.18" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud10" src="shared/audio/pop.wav" data-start="13.2" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud11" src="shared/audio/pop.wav" data-start="14.3" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud12" src="shared/audio/pop.wav" data-start="15.6" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud13" src="shared/audio/confirm.wav" data-start="17.0" data-duration="0.4" data-track-index="22" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script src="shared/js/sprites.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const OK = "#7cfb4c", RD = "#ff5f57", PU = "#c084fc", AM = "#fbbf24", GR = "#d1d5db", MU = "#9c9e8f", CY = "#3fd0e0";
      const S = (t) => `<span class="tok-str">${t}</span>`, K = (t) => `<span class="tok-kw">${t}</span>`, F = (t) => `<span class="tok-fn">${t}</span>`, N = (t) => `<span class="tok-num">${t}</span>`, Mu = (t) => `<span class="tok-mut">${t}</span>`;
      const mkTerm = (rows) => rows.forEach(([id, t, c]) => $("#term").insertAdjacentHTML("beforeend", `<div class="term-row" id="${id}" style="display:none;color:${c}">${t}</div>`));
      const say = (id, t) => tl.set("#" + id, { display: "block", opacity: 1 }, t);
      const mkBadges = (defs) => { $("#badges").innerHTML = defs.map(([t, c], i) => `<span class="px-chip" id="bdg${i}" style="color:${c}">${t}</span>`).join(""); const bs = defs.map((_, i) => $("#bdg" + i)); return (i, t) => XF.only(tl, bs, bs[i], t); };
      const bar = (name) => `<div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">${name}</span><span class="code-badge-slot" id="badges"></span></div>`;

      const rows = XF.buildCode($("#codeBody"), [`${F(":method:")} GET ${Mu("→ estático [2]")}`, `${F(":path:")} /api/users ${Mu("→ dinámica #62")}`, `${F("user-agent:")} Moz/5.0 ${Mu("→ #63")}`, `${F("accept:")} application/json ${Mu("→ #64")}`, `${Mu("# request 2 solo manda [2][62][63][64]")}`]);
      const HC = [CY, "rgba(63,208,224,.16)"];
      const badge = mkBadges([["REQUEST 1 · LITERALES", PU], ["TABLA SINCRONIZADA", OK], ["REQUEST 2 · ÍNDICES", CY], ["HPACK COMPLETADO", OK]]);
      const sv = XF.stack($("#sv"), ["-81 %"]); XF.only(tl, sv, sv[0], 0); tl.set(sv, { opacity: 0 }, 0.01);
      mkTerm([["p0", "GET /api/users → headers en texto", "#e9d5ff"], ["p1", ":method GET ya existe → índice estático [2]", "#7dd3fc"], ["p2", "nuevo header → se guarda como #62", "#c8ffb0"], ["p3", "nuevo header → se guarda como #63", "#c8ffb0"], ["p4", "nuevo header → se guarda como #64", "#c8ffb0"], ["p5", "cliente y servidor comparten la misma tabla", OK],
        ["q1", "request 2 envía [2] en vez del texto", "#7dd3fc"], ["q2", "request 2 envía #62 en vez del texto", "#7dd3fc"], ["q3", "request 2 envía #63 en vez del texto", "#7dd3fc"], ["q4", "request 2 envía #64 en vez del texto", "#7dd3fc"], ["q5", "128 B → 24 B", AM], ["q6", "HPACK: tablas compartidas + Huffman", OK]]);
      const rowOn = (id, t, c = "#7cfb4c") => { tl.set("#" + id, { opacity: 1, borderColor: c }, t); };
      let shownRows = [];
      const sayK = (id, t) => { say(id, t); shownRows.push(id); if (shownRows.length > 6) tl.set("#" + shownRows[shownRows.length - 7], { display: "none" }, t); };

      badge(0, 0.2); sayK("p0", 0.4); tl.set("#hs", { opacity: 1 }, 0.6);
      XF.activeLine(tl, rows, 1, 2.0, ...HC); tl.set("#hs", { borderColor: "#3fd0e0" }, 2.0); sayK("p1", 2.0);
      [["h62", 2, 3.6], ["h63", 3, 5.2], ["h64", 4, 6.8]].forEach(([id, ln, t], i) => { XF.activeLine(tl, rows, ln, t, ...HC); rowOn(id, t); sayK("p" + (2 + i), t + 0.1); });
      XF.activeLine(tl, rows, 5, 8.4, ...HC); badge(1, 8.4); sayK("p5", 8.5); tl.set("#b1", { opacity: 1 }, 8.8);
      // request 2: solo índices
      badge(2, 10.6); tl.set(["#hs", "#h62", "#h63", "#h64"], { borderColor: "#2e2e2e" }, 10.6);
      [["cps", "hs", 1], ["cp62", "h62", 2], ["cp63", "h63", 3], ["cp64", "h64", 4]].forEach(([cp, row, ln], i) => { const t = 11.0 + i * 1.1; XF.activeLine(tl, rows, ln, t, ...HC); tl.set("#" + cp, { opacity: 1 }, t); tl.set("#" + row, { borderColor: "#3fd0e0" }, t); sayK("q" + (1 + i), t + 0.1); });
      XF.activeLine(tl, rows, 5, 15.6, ...HC); tl.set("#b2", { opacity: 1 }, 15.6); tl.fromTo("#b2", { width: "876px" }, { width: "170px", duration: 1.0, ease: "steps(10)" }, 15.6); sayK("q5", 15.7);
      tl.set(sv, { opacity: 1 }, 17.0); badge(3, 17.0); sayK("q6", 17.0); XF.activeLine(tl, rows, 0, 18.6);

      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 43, yoyo: true }, 0);
      tl.set({}, {}, 22);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
