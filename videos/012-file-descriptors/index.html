<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #mascot { left: 72px; bottom: 14px; width: 96px; height: 96px; }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
      
      #codePanel { left: 72px; top: 330px; width: 936px; }
      #codePanel .code-line { height: 52px; font-size: 30px; }
      #card { left: 72px; top: 690px; width: 936px; height: 540px; }
      #fd { position: absolute; left: 0; top: 0; width: 936px; height: 540px; font-family: var(--font-code); }
      .bx { fill: rgba(249,230,198,.05); stroke: var(--line); stroke-width: 5; }
      .t { font-size: 30px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
      .s { font-size: 26px; font-weight: 700; fill: var(--muted); text-anchor: middle; }
      .pt { font-size: 28px; font-weight: 800; }
      .w { fill: none; stroke-width: 7; }
      #term { left: 72px; top: 1260px; width: 936px; height: 400px; }

    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="20" data-track-index="0">LINUX · REDIRECCIONES</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="20" data-track-index="1">File descriptors:<br />0, 1 y 2</h1>
      
      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="20" data-track-index="2">
        <div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">redirecciones.sh</span><span class="code-badge-slot" id="badges"></span></div>
        <div class="code-body" id="codeBody"></div>
      </div>
      <div id="card" class="abs px-box clip" data-start="0" data-duration="20" data-track-index="3">
        <svg id="fd" viewBox="0 0 936 540" style="shape-rendering:crispEdges">
          <rect class="bx" x="30" y="30" width="230" height="86" /><text class="t" x="145" y="84">teclado</text>
          <path class="w" d="M 145 116 C 145 170, 250 200, 330 210" stroke="#3fd0e0" /><text class="pt" x="262" y="176" fill="#3fd0e0">[0]</text>
          <rect class="bx" x="330" y="150" width="260" height="250" style="stroke:#f1a449" />
          <text class="t" x="460" y="250">PROCESO</text><text class="s" x="460" y="296">tabla de fds</text>
          <text class="pt" x="598" y="196" fill="#7cfb4c">[1]</text><text class="pt" x="598" y="286" fill="#ff5f57">[2]</text>
          <rect class="bx" x="700" y="30" width="206" height="180" /><text class="t" x="803" y="130">terminal</text>
          <rect id="fileBox" class="bx" x="700" y="320" width="206" height="190" />
          <text class="t" x="803" y="380">out.txt</text>
          <text id="plus" x="870" y="356" style="font-size:44px;font-weight:800;fill:#fdba74" opacity="0">+</text>
          <g id="modes">
            <text class="s" id="m0" x="803" y="440" opacity="1">vacía</text>
            <text class="s" id="m1" x="803" y="440" opacity="0" style="fill:#fdba74">trunca</text>
            <text class="s" id="m2" x="803" y="440" opacity="0" style="fill:#fdba74">añade</text>
            <text class="s" id="m3" x="803" y="440" opacity="0" style="fill:#fdba74">fd1 + fd2</text>
          </g>
          <path id="wOS" class="w" d="M 590 200 C 650 200, 650 120, 700 120" stroke="#7cfb4c" />
          <path id="wES" class="w" d="M 590 290 C 650 290, 650 170, 700 170" stroke="#ff5f57" />
          <path id="wOF" class="w" d="M 590 200 C 645 200, 645 380, 700 380" stroke="#f1a449" opacity="0" />
          <path id="wEF" class="w" d="M 590 290 C 640 290, 640 450, 700 450" stroke="#f1a449" opacity="0" />
        </svg>
      </div>
      <div id="term" class="abs px-box term clip" data-start="0" data-duration="20" data-track-index="4"><div class="term-label">CONSOLA</div></div>

      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="20" data-track-index="5" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="20" data-track-index="7">@xeland314</div>

      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud0" src="shared/audio/piano-retro.wav" data-start="0" data-duration="20" data-track-index="20" data-volume="0.22" data-fade-in="0.5" data-fade-out="2"></audio>
      <audio id="aud1" src="shared/audio/blip.wav" data-start="0.4" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud2" src="shared/audio/pop.wav" data-start="5.0" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/pop.wav" data-start="9.4" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/pop.wav" data-start="13.6" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/confirm.wav" data-start="17.0" data-duration="0.4" data-track-index="22" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const OK = "#7cfb4c", RD = "#ff5f57", PU = "#c084fc", AM = "#fbbf24", GR = "#d1d5db", MU = "#9c9e8f", CY = "#3fd0e0";
      const S = (t) => `<span class="tok-str">${t}</span>`, K = (t) => `<span class="tok-kw">${t}</span>`, F = (t) => `<span class="tok-fn">${t}</span>`, N = (t) => `<span class="tok-num">${t}</span>`, Mu = (t) => `<span class="tok-mut">${t}</span>`;
      const mkTerm = (rows) => rows.forEach(([id, t, c]) => $("#term").insertAdjacentHTML("beforeend", `<div class="term-row" id="${id}" style="display:none;color:${c}">${t}</div>`));
      const say = (id, t) => tl.set("#" + id, { display: "block", opacity: 1 }, t);
      const mkBadges = (defs) => { $("#badges").innerHTML = defs.map(([t, c], i) => `<span class="px-chip" id="bdg${i}" style="color:${c}">${t}</span>`).join(""); const bs = defs.map((_, i) => $("#bdg" + i)); return (i, t) => XF.only(tl, bs, bs[i], t); };
      const bar = (name) => `<div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">${name}</span><span class="code-badge-slot" id="badges"></span></div>`;

      const rows = XF.buildCode($("#codeBody"), [`${F("cmd")} ${Mu("# 0←teclado · 1,2→pantalla")}`, `${F("cmd")} ${S("&gt;")}  out.txt ${Mu("# fd1→archivo")}`, `${F("cmd")} ${N("&gt;&gt;")} out.txt ${Mu("# añade al final")}`, `${F("cmd")} ${K("2&gt;&amp;1")} ${Mu("# fd2 duplica a fd1")}`]);
      const C = ["#f1a449", "rgba(241,164,73,.16)"];
      const badge = mkBadges([["POR DEFECTO", GR], ["> TRUNCA", "#f1a449"], [">> AÑADE", "#f1a449"], ["2>&1 DUPLICA", CY], ["TODO REDIRIGIDO", OK]]);
      mkTerm([["f0", "fd0←teclado · fd1 y fd2→pantalla", GR], ["f1", "> reconecta fd1 al archivo (lo trunca)", "#f1a449"], ["f2", ">> añade al final sin borrar", "#f1a449"], ["f3", "2>&1 duplica fd2 hacia donde apunta fd1", CY], ["f4", "todo pasó por la tabla de fds del proceso", OK]]);
      const mode = (i, t) => [0, 1, 2, 3].forEach((k) => tl.set("#m" + k, { opacity: k === i ? 1 : 0 }, t));
      badge(0, 0.2); XF.activeLine(tl, rows, 1, 0.4, ...C); say("f0", 0.4);
      // > trunca
      badge(1, 5.0); XF.activeLine(tl, rows, 2, 5.0, ...C); say("f1", 5.0);
      tl.set("#wOS", { opacity: 0 }, 5.0); tl.set("#wOF", { opacity: 1 }, 5.0); mode(1, 5.0); tl.set("#fileBox", { stroke: "#f1a449" }, 5.0);
      // >> añade
      badge(2, 9.4); XF.activeLine(tl, rows, 3, 9.4, ...C); say("f2", 9.4); mode(2, 9.4); tl.set("#plus", { opacity: 1 }, 9.4);
      // 2>&1
      badge(3, 13.6); XF.activeLine(tl, rows, 4, 13.6, CY, "rgba(63,208,224,.16)"); say("f3", 13.6);
      tl.set("#wES", { opacity: 0 }, 13.6); tl.set("#wEF", { opacity: 1 }, 13.6); mode(3, 13.6);
      badge(4, 17.0); say("f4", 17.0); XF.activeLine(tl, rows, 0, 18.4);

      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 39, yoyo: true }, 0);
      tl.set({}, {}, 20);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
