<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #mascot { left: 72px; bottom: 14px; width: 96px; height: 96px; }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
      
      #codePanel { left: 72px; top: 330px; width: 936px; }
      #codePanel .code-line { height: 42px; font-size: 28px; }
      #card { left: 72px; top: 870px; width: 936px; height: 470px; }
      #pila { position: absolute; left: 40px; top: 60px; width: 480px; height: 380px; border: 6px solid var(--line); border-top: 0; }
      .dc { position: absolute; left: 20px; width: 428px; height: 92px; display: flex; align-items: center; justify-content: center; font-family: var(--font-code); font-weight: 800; font-size: 28px; background: var(--panel-2); border: 5px solid currentColor; opacity: 0; }
      #lbl { position: absolute; left: 40px; top: 14px; font-family: var(--font-label); font-weight: 700; font-size: 28px; color: var(--muted); }
      #lifo { position: absolute; left: 560px; top: 90px; width: 340px; text-align: center; }
      #lifo b { display: block; font-family: var(--font-display); font-size: 64px; color: var(--accent); margin-bottom: 24px; }
      #lifo span { font-family: var(--font-label); font-weight: 700; font-size: 28px; color: var(--ink); line-height: 1.4; }
      #dir { position: absolute; left: 560px; top: 372px; width: 340px; height: 60px; text-align: center; font-family: var(--font-display); font-size: 36px; }
      #term { left: 72px; top: 1370px; width: 936px; height: 340px; }

    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="20" data-track-index="0">GO · DEFER</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="20" data-track-index="1">Go defer:<br />la pila LIFO</h1>
      
      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="20" data-track-index="2">
        <div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">defer.go</span><span class="code-badge-slot" id="badges"></span></div>
        <div class="code-body" id="codeBody"></div>
      </div>
      <div id="card" class="abs px-box clip" data-start="0" data-duration="20" data-track-index="3">
        <div id="lbl">PILA DE DEFER</div>
        <div id="pila"></div>
        <div id="lifo"><b>LIFO</b><span>el último en entrar<br />es el primero en salir</span></div>
        <div id="dir"></div>
      </div>
      <div id="term" class="abs px-box term clip" data-start="0" data-duration="20" data-track-index="4"><div class="term-label">CONSOLA</div></div>

      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="20" data-track-index="5" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="20" data-track-index="7">@xeland314</div>

      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud1" src="shared/audio/blip.wav" data-start="0.4" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud2" src="shared/audio/pop.wav" data-start="3.0" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/pop.wav" data-start="4.4" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/pop.wav" data-start="5.8" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/blip.wav" data-start="8.8" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud6" src="shared/audio/pop.wav" data-start="9.8" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud7" src="shared/audio/pop.wav" data-start="11.6" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud8" src="shared/audio/pop.wav" data-start="13.4" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud9" src="shared/audio/confirm.wav" data-start="15.4" data-duration="0.4" data-track-index="22" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const OK = "#7cfb4c", RD = "#ff5f57", PU = "#c084fc", AM = "#fbbf24", GR = "#d1d5db", MU = "#9c9e8f", CY = "#3fd0e0";
      const S = (t) => `<span class="tok-str">${t}</span>`, K = (t) => `<span class="tok-kw">${t}</span>`, F = (t) => `<span class="tok-fn">${t}</span>`, N = (t) => `<span class="tok-num">${t}</span>`, Mu = (t) => `<span class="tok-mut">${t}</span>`;
      const mkTerm = (rows) => rows.forEach(([id, t, c]) => $("#term").insertAdjacentHTML("beforeend", `<div class="term-row" id="${id}" style="display:none;color:${c}">${t}</div>`));
      const say = (id, t) => tl.set("#" + id, { display: "block", opacity: 1 }, t);
      const mkBadges = (defs) => { $("#badges").innerHTML = defs.map(([t, c], i) => `<span class="px-chip" id="bdg${i}" style="color:${c}">${t}</span>`).join(""); const bs = defs.map((_, i) => $("#bdg" + i)); return (i, t) => XF.only(tl, bs, bs[i], t); };
      const bar = (name) => `<div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">${name}</span><span class="code-badge-slot" id="badges"></span></div>`;

      const L = (t) => `<span style="color:#c792ea">${t}</span>`;
      const rows = XF.buildCode($("#codeBody"), [
        `${K("func")} ${F("processOrder")}() {`, `  ${F("fmt.Println")}(${S('"abriendo pedido"')})`, ``,
        `  ${K("defer")} ${F("fmt.Println")}(${S('"cerrando conexión db"')})`, `  ${K("defer")} ${F("fmt.Println")}(${S('"liberando lock"')})`, `  ${K("defer")} ${F("fmt.Println")}(${S('"enviando log"')})`, ``,
        `  ${F("fmt.Println")}(${S('"procesando pedido..."')})`, `}  ${Mu("// return → ejecuta los defers")}`]);
      const C = [PU, "rgba(192,132,252,.16)"];
      const badge = mkBadges([["ABRIENDO PEDIDO", GR], ["PUSH DEFER", PU], ["RETURN → DEFERS", AM], ["POP · LIFO", OK], ["LIFO COMPLETO", OK]]);
      const META = { db: ["cerrando conexión db", CY, 0], lock: ["liberando lock", "#facc15", 1], log: ["enviando log", PU, 2] };
      Object.entries(META).forEach(([k, [t, c, i]]) => $("#pila").insertAdjacentHTML("beforeend", `<div class="dc" id="dc-${k}" style="color:${c};top:${270 - i * 104}px">${t}</div>`));
      const dir = XF.stack($("#dir"), ["PUSH ↓", "POP ↑"]); dir[0].style.color = PU; dir[1].style.color = OK; XF.only(tl, dir, dir[0], 0);
      tl.set(dir, { opacity: 0 }, 0.01);
      mkTerm([["d1", "abriendo pedido", GR], ["d2", "procesando pedido...", GR], ["d3", "enviando log", PU], ["d4", "liberando lock", "#facc15"], ["d5", "cerrando conexión db", CY], ["d6", "defer: último en entrar, primero en salir", OK]]);
      const push = (k, t) => { const y = parseInt($("#dc-" + k).style.top); tl.set("#dc-" + k, { opacity: 1, y: -230 }, t); tl.fromTo("#dc-" + k, { y: -230 }, { y: 0, duration: 0.6, ease: "steps(6)" }, t); };
      const pop = (k, t) => { tl.set("#dc-" + k, { borderColor: "#f9e6c6" }, t); tl.to("#dc-" + k, { y: -150, opacity: 0, duration: 0.8, ease: "steps(6)" }, t + 0.5); };

      badge(0, 0.2); XF.activeLine(tl, rows, 1, 0.4, ...C); XF.activeLine(tl, rows, 2, 1.4, ...C); say("d1", 1.4);
      badge(1, 3.0); tl.set(dir, { opacity: 0 }, 2.9); XF.only(tl, dir, dir[0], 3.0);
      XF.activeLine(tl, rows, 4, 3.0, ...C); push("db", 3.0); XF.activeLine(tl, rows, 5, 4.4, ...C); push("lock", 4.4); XF.activeLine(tl, rows, 6, 5.8, ...C); push("log", 5.8);
      XF.activeLine(tl, rows, 8, 7.4, ...C); say("d2", 7.4);
      badge(2, 8.8); XF.activeLine(tl, rows, 9, 8.8, "#fbbf24", "rgba(251,191,36,.16)");
      badge(3, 9.8); XF.only(tl, dir, dir[1], 9.8);
      pop("log", 9.8); say("d3", 10.1); pop("lock", 11.6); say("d4", 11.9); pop("db", 13.4); say("d5", 13.7);
      badge(4, 15.4); say("d6", 15.4); XF.activeLine(tl, rows, 0, 17.0);

      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 39, yoyo: true }, 0);
      tl.set({}, {}, 20);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
