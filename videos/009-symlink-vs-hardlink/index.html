<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #mascot { left: 72px; bottom: 14px; width: 96px; height: 96px; }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
      
      #codePanel { left: 72px; top: 340px; width: 936px; }
      #codePanel .code-line { height: 52px; font-size: 30px; }
      #card { left: 72px; top: 690px; width: 936px; height: 650px; }
      .nm { position: absolute; left: 70px; width: 330px; height: 84px; display: flex; align-items: center; justify-content: center; font-family: var(--font-code); font-weight: 700; font-size: 30px; color: var(--ink); background: var(--panel-2); border: var(--px) solid var(--line); opacity: 0; }
      #inode { position: absolute; left: 580px; top: 40px; width: 320px; height: 260px; padding: 18px 20px; background: var(--panel-2); border: var(--px) solid var(--accent); opacity: 0; font-family: var(--font-code); font-size: 28px; color: var(--ink); line-height: 1.7; }
      #inode b { font-family: var(--font-display); font-size: 24px; color: var(--accent); display: block; margin-bottom: 8px; }
      #nl { position: relative; display: inline-block; width: 40px; height: 40px; vertical-align: -8px; font-family: var(--font-display); font-size: 30px; }
      #nl .stk { text-align: left; }
      #wires { position: absolute; left: 0; top: 0; width: 936px; height: 650px; }
      .res { position: absolute; left: 30px; height: 56px; padding: 6px 16px; font-size: 28px; opacity: 0; white-space: nowrap; }
      #moral { position: absolute; left: 30px; right: 30px; bottom: 18px; font-family: var(--font-label); font-weight: 700; font-size: 28px; color: var(--accent); line-height: 1.3; opacity: 0; }
      #term { left: 72px; top: 1370px; width: 936px; height: 340px; }

    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="20" data-track-index="0">LINUX · SISTEMA DE ARCHIVOS</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="20" data-track-index="1">Symlink vs<br />Hard link</h1>
      
      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="20" data-track-index="2">
        <div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">links.sh</span><span class="code-badge-slot" id="badges"></span></div>
        <div class="code-body" id="codeBody"></div>
      </div>
      <div id="card" class="abs px-box clip" data-start="0" data-duration="20" data-track-index="3">
        <svg id="wires" viewBox="0 0 936 650" style="shape-rendering:crispEdges">
          <path id="w1" d="M 400 92 L 580 120" stroke="#7cfb4c" stroke-width="6" fill="none" opacity="0" />
          <path id="w2" d="M 400 232 L 580 200" stroke="#7cfb4c" stroke-width="6" fill="none" opacity="0" />
          <path id="w3" d="M 70 372 H 30 V 92 H 62" stroke="#3fd0e0" stroke-width="6" stroke-dasharray="14 10" fill="none" opacity="0" />
          <polygon id="w3h" points="70,92 52,82 52,102" fill="#3fd0e0" opacity="0" />
          <path id="w3x" d="M 70 372 H 30 V 92 H 62" stroke="#ff5f57" stroke-width="6" stroke-dasharray="4 14" fill="none" opacity="0" />
        </svg>
        <div class="nm" id="n1" style="top:50px">archivo.txt</div>
        <div class="nm" id="n2" style="top:190px">duro.hlk</div>
        <div class="nm" id="n3" style="top:330px">sim.link</div>
        <div id="inode"><b>INODO #4821</b>datos: Hola<br />enlaces: <span id="nl"></span></div>
        <div class="res px-chip" id="rs1" style="top:450px;color:var(--sem-bad)">cat sim.link → no existe</div>
        <div class="res px-chip" id="rs2" style="top:520px;color:var(--sem-ok)">cat duro.hlk → Hola</div>
        <div id="moral">los datos mueren con el ÚLTIMO hard link</div>
      </div>
      <div id="term" class="abs px-box term clip" data-start="0" data-duration="20" data-track-index="4"><div class="term-label">CONSOLA</div></div>

      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="20" data-track-index="5" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="20" data-track-index="7">@xeland314</div>

      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud1" src="shared/audio/blip.wav" data-start="0.4" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud2" src="shared/audio/pop.wav" data-start="1.0" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/pop.wav" data-start="3.4" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/pop.wav" data-start="5.6" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/error.wav" data-start="7.4" data-duration="0.45" data-track-index="22" data-volume="0.8"></audio>
      <audio id="aud6" src="shared/audio/whoosh.wav" data-start="8.8" data-duration="0.6" data-track-index="23" data-volume="0.5"></audio>
      <audio id="aud7" src="shared/audio/pop.wav" data-start="10.2" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud8" src="shared/audio/error.wav" data-start="11.8" data-duration="0.45" data-track-index="21" data-volume="0.8"></audio>
      <audio id="aud9" src="shared/audio/confirm.wav" data-start="13.6" data-duration="0.4" data-track-index="22" data-volume="0.8"></audio>
      <audio id="aud10" src="shared/audio/confirm.wav" data-start="15.4" data-duration="0.4" data-track-index="23" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const OK = "#7cfb4c", RD = "#ff5f57", PU = "#c084fc", AM = "#fbbf24", GR = "#d1d5db", MU = "#9c9e8f", CY = "#3fd0e0";
      const S = (t) => `<span class="tok-str">${t}</span>`, K = (t) => `<span class="tok-kw">${t}</span>`, F = (t) => `<span class="tok-fn">${t}</span>`, N = (t) => `<span class="tok-num">${t}</span>`, Mu = (t) => `<span class="tok-mut">${t}</span>`;
      const mkTerm = (rows) => rows.forEach(([id, t, c]) => $("#term").insertAdjacentHTML("beforeend", `<div class="term-row" id="${id}" style="display:none;color:${c}">${t}</div>`));
      const say = (id, t) => tl.set("#" + id, { display: "block", opacity: 1 }, t);
      const mkBadges = (defs) => { $("#badges").innerHTML = defs.map(([t, c], i) => `<span class="px-chip" id="bdg${i}" style="color:${c}">${t}</span>`).join(""); const bs = defs.map((_, i) => $("#bdg" + i)); return (i, t) => XF.only(tl, bs, bs[i], t); };
      const bar = (name) => `<div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">${name}</span><span class="code-badge-slot" id="badges"></span></div>`;

      const rows = XF.buildCode($("#codeBody"), [`${S("$ echo")} Hola &gt; archivo.txt`, `${S("$ ln")}  archivo.txt ${F("duro.hlk")}`, `${S("$ ln -s")} archivo.txt ${F("sim.link")}`, `<span style="color:#ff5f57">$ rm</span>  archivo.txt ${Mu("# ¿y los datos?")}`]);
      const C = [CY, "rgba(63,208,224,.16)"];
      const badge = mkBadges([["CREANDO LOS NOMBRES", CY], ["BORRANDO ORIGINAL", RD], ["INODO VIVO · NLINK=1", OK], ["DATOS INTACTOS", OK]]);
      const nl = XF.stack($("#nl"), ["1", "2", "1"]);
      XF.only(tl, nl, nl[0], 0);
      [["n1", "#7cfb4c"], ["n2", "#7cfb4c"], ["n3", "#3fd0e0"]].forEach(([id, c]) => tl.set("#" + id, { borderColor: c }, 0));
      mkTerm([["s1", "$ echo Hola > archivo.txt", GR], ["s2", "hard link → MISMO inodo #4821", OK], ["s3", "symlink → guarda la RUTA del nombre", CY],
        ["s4", "$ rm archivo.txt", RD], ["s5", "rm solo borra la ENTRADA", AM], ["s6", "nlink del inodo baja de 2 → 1", AM], ["s7", "sim.link apunta a una ruta rota", RD], ["s8", "$ cat duro.hlk → Hola", OK], ["s9", "los datos mueren con el ÚLTIMO enlace", PU]]);
      const show = (sel, t) => tl.set(sel, { opacity: 1 }, t);

      badge(0, 0.2); XF.activeLine(tl, rows, 1, 0.4, ...C); say("s1", 0.4);
      show("#n1", 1.0); show("#inode", 1.0); show("#w1", 1.2);
      XF.activeLine(tl, rows, 2, 3.2, ...C); show("#n2", 3.2); show("#w2", 3.4); XF.only(tl, nl, nl[1], 3.4); say("s2", 3.4);
      XF.activeLine(tl, rows, 3, 5.4, ...C); show("#n3", 5.4); show("#w3", 5.6); show("#w3h", 5.6); say("s3", 5.6);
      // 7.4 rm
      tl.set(["#s1", "#s2", "#s3"], { display: "none" }, 7.2);
      badge(1, 7.2); XF.activeLine(tl, rows, 4, 7.4, RD, "rgba(255,95,87,.16)"); say("s4", 7.4);
      tl.set("#n1", { opacity: 0.3, textDecoration: "line-through" }, 8.8); tl.set("#w1", { opacity: 0.12 }, 8.8); say("s5", 8.8);
      XF.only(tl, nl, nl[2], 10.2); tl.set("#nl", { color: "#fbbf24" }, 10.2); badge(2, 10.2); say("s6", 10.2);
      tl.set("#w3", { opacity: 0 }, 11.8); tl.set("#w3h", { opacity: 0 }, 11.8); show("#w3x", 11.8); show("#rs1", 11.8); tl.set("#n3", { borderColor: "#ff5f57" }, 11.8); say("s7", 11.8);
      show("#rs2", 13.6); say("s8", 13.6); badge(3, 13.6);
      show("#moral", 15.4); say("s9", 15.4); XF.activeLine(tl, rows, 0, 17.4);

      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 39, yoyo: true }, 0);
      tl.set({}, {}, 20);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
