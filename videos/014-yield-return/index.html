<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="shared/styles/fonts.css" />
    <link rel="stylesheet" href="shared/styles/tokens.css" />
    <link rel="stylesheet" href="shared/styles/pixel.css" />
    <link rel="stylesheet" href="shared/styles/code.css" />
    <style>
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      #eyebrow { left: 72px; top: 120px; font-size: 28px; }
      #title { left: 72px; top: 170px; font-size: 40px; width: 936px; }
      #mascot { left: 72px; bottom: 14px; width: 96px; height: 96px; }
      #mark { right: 72px; bottom: 56px; font-size: 28px; }
      
      #codePanel { left: 72px; top: 330px; width: 936px; }
      #codePanel .code-line { height: 48px; font-size: 30px; }
      #codeBody { position: relative; height: 240px; }
      .set { position: absolute; left: 0; right: 0; top: 0; opacity: 0; }
      #card { left: 72px; top: 710px; width: 936px; height: 400px; }
      #cl { position: absolute; left: 30px; top: 20px; font-family: var(--font-label); font-weight: 700; font-size: 28px; color: var(--muted); }
      .sl { position: absolute; top: 90px; width: 190px; height: 130px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 48px; color: var(--ink); border: 5px dashed var(--cat-gray); }
      #ram { position: absolute; left: 30px; right: 30px; top: 270px; height: 100px; font-family: var(--font-code); font-weight: 800; font-size: 32px; }
      #ram .stk { text-align: left; }
      #term { left: 72px; top: 1140px; width: 936px; height: 440px; }

    </style>
  </head>
  <body>
    <div id="root" class="px-grid-bg" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <div id="eyebrow" class="abs px-eyebrow clip" data-start="0" data-duration="21" data-track-index="0">PYTHON · GENERADORES</div>
      <h1 id="title" class="abs px-title clip" data-start="0" data-duration="21" data-track-index="1">return vs yield:<br />lista o bajo demanda</h1>
      
      <div id="codePanel" class="abs px-box code-panel clip" data-start="0" data-duration="21" data-track-index="2">
        <div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file" style="position:relative;width:360px;height:36px">modo_return.py</span><span class="code-badge-slot" id="badges"></span></div>
        <div class="code-body" id="codeBody"></div>
      </div>
      <div id="card" class="abs px-box clip" data-start="0" data-duration="21" data-track-index="3">
        <div id="cl">MEMORIA RAM</div><div id="slots"></div><div id="ram"></div>
      </div>
      <div id="term" class="abs px-box term clip" data-start="0" data-duration="21" data-track-index="4"><div class="term-label">CONSOLA</div></div>
      <img id="mascot" class="abs pixelated clip" src="shared/sprites/gato-sin-fondo.svg" alt="" data-start="0" data-duration="21" data-track-index="5" />
      <div id="mark" class="abs px-mark clip" data-start="0" data-duration="21" data-track-index="7">@xeland314</div>

      <!-- audio:start (generado por scripts/make-audio.mjs; ver docs/sonido.md) -->
      <audio id="aud0" src="shared/audio/piano-retro.wav" data-start="0" data-duration="21" data-track-index="20" data-volume="0.22" data-fade-in="0.5" data-fade-out="2"></audio>
      <audio id="aud1" src="shared/audio/blip.wav" data-start="0.4" data-duration="0.12" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud2" src="shared/audio/pop.wav" data-start="3.0" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud3" src="shared/audio/pop.wav" data-start="4.3" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud4" src="shared/audio/pop.wav" data-start="5.6" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud5" src="shared/audio/pop.wav" data-start="6.9" data-duration="0.18" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud6" src="shared/audio/confirm.wav" data-start="9.6" data-duration="0.4" data-track-index="23" data-volume="0.8"></audio>
      <audio id="aud7" src="shared/audio/blip.wav" data-start="10.8" data-duration="0.12" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud8" src="shared/audio/pop.wav" data-start="11.7" data-duration="0.18" data-track-index="21" data-volume="0.7"></audio>
      <audio id="aud9" src="shared/audio/pop.wav" data-start="13.6" data-duration="0.18" data-track-index="22" data-volume="0.7"></audio>
      <audio id="aud10" src="shared/audio/pop.wav" data-start="15.5" data-duration="0.18" data-track-index="23" data-volume="0.7"></audio>
      <audio id="aud11" src="shared/audio/pop.wav" data-start="17.4" data-duration="0.18" data-track-index="24" data-volume="0.7"></audio>
      <audio id="aud12" src="shared/audio/confirm.wav" data-start="19.2" data-duration="0.4" data-track-index="21" data-volume="0.8"></audio>
      <!-- audio:end -->
    </div>

    <script src="shared/js/lib.js"></script>
    <script src="shared/js/sprites.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const OK = "#7cfb4c", RD = "#ff5f57", PU = "#c084fc", AM = "#fbbf24", GR = "#d1d5db", MU = "#9c9e8f", CY = "#3fd0e0";
      const S = (t) => `<span class="tok-str">${t}</span>`, K = (t) => `<span class="tok-kw">${t}</span>`, F = (t) => `<span class="tok-fn">${t}</span>`, N = (t) => `<span class="tok-num">${t}</span>`, Mu = (t) => `<span class="tok-mut">${t}</span>`;
      const mkTerm = (rows) => rows.forEach(([id, t, c]) => $("#term").insertAdjacentHTML("beforeend", `<div class="term-row" id="${id}" style="display:none;color:${c}">${t}</div>`));
      const say = (id, t) => tl.set("#" + id, { display: "block", opacity: 1 }, t);
      const mkBadges = (defs) => { $("#badges").innerHTML = defs.map(([t, c], i) => `<span class="px-chip" id="bdg${i}" style="color:${c}">${t}</span>`).join(""); const bs = defs.map((_, i) => $("#bdg" + i)); return (i, t) => XF.only(tl, bs, bs[i], t); };
      const bar = (name) => `<div class="code-top"><span class="code-dot" style="color:#ff5f57"></span><span class="code-dot" style="color:#febc2e"></span><span class="code-dot" style="color:#28c840"></span><span class="code-file">${name}</span><span class="code-badge-slot" id="badges"></span></div>`;

      const rA = XF.buildCode($("#codeBody"), [`${K("def")} ${F("obtener_datos")}()${Mu(":")}`, `    lista ${Mu("=")} []`, `    ${K("for")} i ${K("in")} ${F("range")}(${N("1")}, ${N("5")})${Mu(":")}`, `        lista.${F("append")}(i)`, `    ${K("return")} lista  ${Mu("# retorna TODO acumulado")}`]);
      const rB = XF.buildCode($("#codeBody"), [`${K("def")} ${F("generar_datos")}()${Mu(":")}`, `    ${K("for")} i ${K("in")} ${F("range")}(${N("1")}, ${N("5")})${Mu(":")}`, `        ${K("yield")} i  ${Mu("# devuelve 1 a 1 y PAUSA")}`, ``, `${Mu("# consume bajo demanda, sin saturar la RAM")}`]);
      // buildCode reemplaza el contenido: separar en dos conjuntos
      const setA = document.createElement("div"); setA.className = "set"; setA.id = "sRet";
      const setB = document.createElement("div"); setB.className = "set"; setB.id = "sYld";
      const mk = (el, lines) => { el.innerHTML = lines.map((h, i) => `<div class="code-line" data-id="${i + 1}"><span class="code-ln">${i + 1}</span><span>${h}</span></div>`).join(""); return [...el.children]; };
      $("#codeBody").innerHTML = ""; $("#codeBody").append(setA, setB);
      const A = mk(setA, [`${K("def")} ${F("obtener_datos")}()${Mu(":")}`, `    lista ${Mu("=")} []`, `    ${K("for")} i ${K("in")} ${F("range")}(${N("1")}, ${N("5")})${Mu(":")}`, `        lista.${F("append")}(i)`, `    ${K("return")} lista  ${Mu("# retorna TODO")}`]);
      const B = mk(setB, [`${K("def")} ${F("generar_datos")}()${Mu(":")}`, `    ${K("for")} i ${K("in")} ${F("range")}(${N("1")}, ${N("5")})${Mu(":")}`, `        ${K("yield")} i  ${Mu("# 1 a 1 y PAUSA")}`, ``, `${Mu("# bajo demanda, sin saturar RAM")}`]);
      const RC = [RD, "rgba(255,95,87,.16)"], YC = [OK, "rgba(124,251,76,.14)"];
      const badgeDefs = [["EJECUTANDO", RD], ["RETORNANDO TODO", RD], ["FINALIZADO", RD], ["EJECUTANDO", OK], ["YIELD 1 (PAUSA)", OK], ["YIELD 2 (PAUSA)", OK], ["YIELD 3 (PAUSA)", OK], ["YIELD 4 (PAUSA)", OK], ["FINALIZADO", OK]];
      const badge = mkBadges(badgeDefs);
      $("#slots").innerHTML = [0, 1, 2, 3].map((i) => `<div class="sl" id="sl${i}" style="left:${30 + i * 220}px">-</div>`).join("");
      const slotTxt = [0, 1, 2, 3].map((i) => XF.stack($("#sl" + i), i === 0 ? ["-", "1", "2", "3", "4"] : ["-", String(i + 1)]));
      // cada slot tiene dos textos apilados ("-" y el número); el contenedor es flex: los apilados son absolutos
      document.querySelectorAll(".sl").forEach((e) => (e.style.position = "absolute"));
      document.querySelectorAll(".sl .stk").forEach((e) => { e.style.left = "0"; e.style.right = "0"; e.style.textAlign = "center"; e.style.top = "34px"; });
      const slot = (i, on, state, t, num = 1) => { XF.only(tl, slotTxt[i], slotTxt[i][on ? (i === 0 ? num : 1) : 0], t); tl.set("#sl" + i, on ? { borderColor: state === "bad" ? "#ff5f57" : "#7cfb4c", backgroundColor: state === "bad" ? "rgba(255,95,87,.16)" : "rgba(124,251,76,.14)", borderStyle: "solid" } : { borderColor: "#7e7f7f", backgroundColor: "rgba(0,0,0,0)", borderStyle: "dashed" }, t); };
      [0, 1, 2, 3].forEach((i) => slot(i, false, "", 0));
      const ramT = XF.stack($("#ram"), ["O(1) · 0 items", "O(N) · creando lista", "O(N) · 1 item en RAM", "O(N) · 2 items en RAM", "O(N) · 3 items en RAM", "O(N) · 4 items en RAM", "O(1) · solo 1 item activo", "O(1) · memoria liberada"]);
      ramT.forEach((e, i) => (e.style.color = i === 0 ? MU : i < 6 ? RD : OK));
      XF.only(tl, ramT, ramT[0], 0);
      mkTerm([["r1", ">>> lista_completa = obtener_datos()", "#ff8e88"], ["r2", "print(lista_completa)", "#999"], ["r3", "[1, 2, 3, 4]", "#ff8e88"],
        ["y0", ">>> for num in generar_datos():", "#c8ffb0"], ["y1", "  print(num) -> 1", OK], ["y2", "  print(num) -> 2", OK], ["y3", "  print(num) -> 3", OK], ["y4", "  print(num) -> 4", OK]]);
      const act = (rowsArr, id, t, c) => XF.activeLine(tl, rowsArr, id, t, ...c);

      // ----- return -----
      tl.set("#sRet", { opacity: 1 }, 0); badge(0, 0.2);
      act(A, 1, 0.4, RC); act(A, 2, 1.4, RC); XF.only(tl, ramT, ramT[1], 1.4);
      for (let i = 1; i <= 4; i++) { const t = 2.4 + (i - 1) * 1.3; act(A, 3, t, RC); act(A, 4, t + 0.5, RC); slot(i - 1, true, "bad", t + 0.5); XF.only(tl, ramT, ramT[i + 1], t + 0.5); }
      act(A, 5, 7.8, RC); badge(1, 7.8); say("r1", 8.4); say("r2", 8.8); say("r3", 9.2); badge(2, 9.6);
      // ----- yield -----
      tl.set("#sRet", { opacity: 0 }, 10.6); tl.set("#sYld", { opacity: 1 }, 10.6);
      tl.set(["#r1", "#r2", "#r3"], { display: "none" }, 10.6); [0, 1, 2, 3].forEach((i) => slot(i, false, "", 10.6));
      tl.set("#sl0", {}, 10.6); XF.only(tl, ramT, ramT[0], 10.6);
      document.querySelector(".code-file").innerHTML = `<span class="stk" id="fnA" style="opacity:1;text-align:left">modo_return.py</span><span class="stk" id="fnB" style="text-align:left">modo_yield.py</span>`; tl.set("#fnA", { opacity: 0 }, 10.6); tl.set("#fnB", { opacity: 1 }, 10.6);
      badge(3, 10.8); say("y0", 10.8);
      for (let i = 1; i <= 4; i++) {
        const t = 11.4 + (i - 1) * 1.9;
        act(B, 2, t, YC); badge(3 + i, t + 0.3); act(B, 3, t + 0.3, YC);
        [0, 1, 2, 3].forEach((k) => slot(k, false, "", t + 0.3)); slot(0, true, "ok", t + 0.3, i);
        XF.only(tl, ramT, ramT[6], t + 0.3); say("y" + i, t + 1.0);
      }
      [0, 1, 2, 3].forEach((k) => slot(k, false, "", 19.2)); XF.only(tl, ramT, ramT[7], 19.2); badge(8, 19.2); XF.activeLine(tl, B, 0, 19.2);

      tl.to("#mascot", { y: -8, duration: 0.5, ease: "steps(1)", repeat: 41, yoyo: true }, 0);
      tl.set({}, {}, 21);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
